name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # Laravel 11 (testbench ^9) is omitted: its releases are flagged by
        # Composer security advisories and refuse to install in CI.
        testbench: ['^10.0']

    name: PHP ${{ matrix.php }} · testbench ${{ matrix.testbench }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --prefer-stable --no-audit

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --prefer-stable --no-audit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pint (dry run)
        run: vendor/bin/pint --test